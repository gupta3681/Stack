server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to the backend service. Docker DNS resolves "backend" to
    # the backend container's internal IP. The trailing slash on proxy_pass
    # strips the /api prefix:  /api/auth/me  ->  http://backend:8000/auth/me
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Long-lived cache for Vite's hashed asset bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html so client-side routing
    # works whenever we add it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
