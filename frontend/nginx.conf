server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy /api/* to the backend service. ${BACKEND_URL} is templated at
    # container startup from the BACKEND_URL env var (see Dockerfile.prod).
    # Locally it defaults to http://backend:8000/ which is the Docker-compose
    # service name. On Railway/Fly/etc. set BACKEND_URL to the platform's
    # internal hostname, e.g. http://backend.railway.internal:8000/
    #
    # The trailing slash strips the /api prefix:
    #   /api/auth/me  ->  ${BACKEND_URL}auth/me
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append (not overwrite) so the user's IP from any front proxy
        # (Cloudflare/Railway/etc.) survives. The backend's _client_ip uses
        # TRUSTED_PROXY_HOPS to pick the right entry safely.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Long-lived cache for Vite's hashed asset bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html so client-side routing
    # works whenever we add it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
