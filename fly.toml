# Fly.io production target.
# Before first deploy:
#   1. Change `app` and CORS_ORIGINS below to your real Fly app/domain.
#   2. Provision Postgres and set DATABASE_URL with `fly secrets set`.

app = "stack"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  APP_ENV = "production"
  COOKIE_SECURE = "true"
  CORS_ORIGINS = "https://stack.fly.dev"
  AUTH_RATE_LIMIT_WINDOW_SECONDS = "900"
  AUTH_RATE_LIMIT_LOGIN_IP_ATTEMPTS = "20"
  AUTH_RATE_LIMIT_LOGIN_EMAIL_ATTEMPTS = "8"
  AUTH_RATE_LIMIT_SIGNUP_WINDOW_SECONDS = "3600"
  AUTH_RATE_LIMIT_SIGNUP_IP_ATTEMPTS = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
