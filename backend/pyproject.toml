[project]
name = "stack-backend"
version = "0.1.0"
description = "Stack — a priority-stack productivity app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "python-dateutil>=2.9",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
